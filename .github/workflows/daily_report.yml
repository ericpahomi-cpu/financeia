name: Daily Financial Report - FinanceAI

on:
  schedule:
    # Tous les jours ouvrables à 7h00 UTC (9h00 Paris)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agent/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd agent
          pip install -r requirements.txt

      - name: Run FinanceAI Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: FinanceAI
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          cd agent
          python main.py

      - name: Notify on failure
        if: failure()
        run: echo "Le rapport quotidien a échoué — vérifier les logs ci-dessus"
